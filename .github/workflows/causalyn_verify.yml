name: Causalyn Shadow Verification (Epoch-V / VPSN)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  verify:
    name: Consensus Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx websockets pytest-github-actions-annotate-failures
          pip install -e .

      - name: Ensure Runtime Directories Exist
        run: |
          mkdir -p runtime runtime/compliance runtime/telemetry runtime/benchmarks

      - name: Build Native Rust Acceleration Kernel
        run: |
          if command -v cargo &> /dev/null; then
            cargo build --release --manifest-path crates/causalyn-core/Cargo.toml
          fi

      - name: Execute Causalyn Continuous Verification
        env:
          PYTHONPATH: .
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git diff "origin/$BASE_REF...HEAD" > /tmp/pr.diff || git diff "origin/main...HEAD" > /tmp/pr.diff || touch /tmp/pr.diff
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff "$EVENT_BEFORE..HEAD" > /tmp/pr.diff || git diff HEAD~1..HEAD > /tmp/pr.diff || touch /tmp/pr.diff
          else
            git diff HEAD~1..HEAD > /tmp/pr.diff || touch /tmp/pr.diff
          fi
          python -m causalyn.cli ci verify-pr --diff /tmp/pr.diff --pr-number "${PR_NUMBER:-1}" --commit-sha "$COMMIT_SHA"

      - name: Run Deterministic Invariant Test Suite
        env:
          PYTHONPATH: .
        run: |
          mkdir -p runtime runtime/compliance runtime/telemetry runtime/benchmarks
          python -m pytest tests/ epoch_v/tests/ -v --tb=auto -rfEsxX --junitxml=test-results.xml || {
            echo "::error::Deterministic Invariant Test Suite Failed"
            if [ -f test-results.xml ]; then
              echo "### Test Failures (test-results.xml)" >> $GITHUB_STEP_SUMMARY
              echo '```xml' >> $GITHUB_STEP_SUMMARY
              head -n 250 test-results.xml >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
            exit 1
          }

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-results
          path: test-results.xml
          if-no-files-found: ignore
