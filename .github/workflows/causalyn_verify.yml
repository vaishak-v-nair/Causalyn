name: Causalyn Shadow Verification (Epoch-V / VPSN)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  verify:
    name: Consensus Verification Gate
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx websockets pytest-github-actions-annotate-failures
          pip install -e .

      - name: Ensure Runtime Directories Exist
        run: |
          mkdir -p runtime runtime/compliance runtime/telemetry runtime/benchmarks api

      - name: Build Native Rust Acceleration Kernel
        run: |
          if command -v cargo &> /dev/null; then
            cargo build --release --manifest-path crates/causalyn-core/Cargo.toml
          fi

      - name: Execute Causalyn Continuous Verification
        env:
          PYTHONPATH: .
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git diff "origin/$BASE_REF...HEAD" > /tmp/pr.diff || git diff "origin/main...HEAD" > /tmp/pr.diff || touch /tmp/pr.diff
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff "$EVENT_BEFORE..HEAD" > /tmp/pr.diff || git diff HEAD~1..HEAD > /tmp/pr.diff || touch /tmp/pr.diff
          else
            git diff HEAD~1..HEAD > /tmp/pr.diff || touch /tmp/pr.diff
          fi
          python -m causalyn.cli ci verify-pr --diff /tmp/pr.diff --pr-number "${PR_NUMBER:-1}" --commit-sha "$COMMIT_SHA"

      - name: Run Deterministic Invariant Test Suite
        env:
          PYTHONPATH: .
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p runtime runtime/compliance runtime/telemetry runtime/benchmarks
          echo "::group::pytest output"
          python -m pytest tests/ epoch_v/tests/ -v --tb=long -rfEsxX --junitxml=test-results.xml > pytest-output.log 2>&1
          TEST_EXIT=$?
          echo "::endgroup::"
          echo "### pytest raw output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 pytest-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_EXIT" -ne 0 ]; then
            python -c "import sys, textwrap; code = '''
            try:
                with open('pytest-output.log', 'r', encoding='utf-8', errors='replace') as f:
                    lines = f.readlines()
                print('::error::--- PYTEST FAILURE LOG ---')
                for line in lines[-150:]:
                    safe_line = line.strip().replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                    print(f'::error::{safe_line}')
                print('::error::--- END PYTEST LOG ---')
            except Exception as e:
                print(f'::error::Failed to read log: {e}')
            '''; exec(textwrap.dedent(code))"

            python scripts/annotate_test_failures.py test-results.xml || true
            if [ -f test-results.xml ]; then
              echo "### test-results.xml" >> $GITHUB_STEP_SUMMARY
              echo '```xml' >> $GITHUB_STEP_SUMMARY
              head -n 250 test-results.xml >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi
          exit $TEST_EXIT

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-results
          path: |
            test-results.xml
            pytest-output.log
          if-no-files-found: ignore
